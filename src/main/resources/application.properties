# Aquí podemos encontrar Spring Boot:
# Sprint Boot Properties para la configuración de la aplicación, base de datos y seguridad.

# - Nombre de la aplicación
spring.application.name=IntelliSave-App

# - Configuración de JPA
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# - Configuración de la base de datos
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/Intelli_Save}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# - spring.datasource.url=jdbc:postgresql://localhost/Intelli_Save
# - spring.datasource.username=postgres
# - spring.datasource.password=root

# - Clave secreta para JWT
jwt.secret=IntelliSaveLumenSaveClaveSecretaParaFirmarTokensJWT2026ArquitecturaWebUPC
# - Servidor (Render asigna el puerto y usa HTTPS)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# applicacion.properties -> Es un archivo de configuración de Spring Boot basado en el formato Java Properties,
# utilizado para definir parámetros de la aplicación como la conexión a la base de datos,
# el puerto del servidor, configuraciones de JPA/Hibernate, seguridad y otras propiedades del framework.