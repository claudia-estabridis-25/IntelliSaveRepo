# Aquí podemos encontrar Spring Boot:
# Sprint Boot Properties para la configuración de la aplicación, base de datos y seguridad.

# - Nombre de la aplicación
spring.application.name=IntelliSave-App

# - Configuración de JPA
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# - Puerto del servidor (en la nube se define con la variable de entorno PORT)
server.port=${PORT:8080}

# - Configuración de la base de datos
# ${VARIABLE:valor} -> usa la variable de entorno si existe; si no, usa el valor por defecto (entorno local).
# Así, al desplegar (por ejemplo en AWS) las credenciales reales no quedan escritas en el repositorio.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/Intelli_Save}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# - Clave secreta para JWT (en producción se define con la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET:IntelliSaveLumenSaveClaveSecretaParaFirmarTokensJWT2026ArquitecturaWebUPC}

# applicacion.properties -> Es un archivo de configuración de Spring Boot basado en el formato Java Properties,
# utilizado para definir parámetros de la aplicación como la conexión a la base de datos,
# el puerto del servidor, configuraciones de JPA/Hibernate, seguridad y otras propiedades del framework.